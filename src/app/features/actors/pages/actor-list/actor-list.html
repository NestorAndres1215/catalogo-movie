<section class="actors-page">
  <app-page-header
    section="CINEVERSE / PERSONAS"
    title="Actores y Actrices"
    description="Conoce a los artistas que dan vida a tus películas y series favoritas."
    [image]="bannerImage"
  />
  <div class="actor-toolbar">
    <app-search
      class="actor-search"
      [value]="searchQuery()"
      placeholder="Buscar actores, actrices y artistas..."
      (valueChange)="onSearch($event)"
    />

    <app-actor-filters [filters]="filters()" (filtersChange)="onFiltersChange($event)" />
  </div>
  <app-results-header
    [title]="searchQuery() ? 'Resultados de búsqueda' : 'Personas populares'"
    [description]="
      searchQuery()
        ? 'Personas que coinciden con tu búsqueda.'
        : 'Descubre las personas más populares del cine y la televisión.'
    "
    [totalResults]="currentPage()"
    [countLabel]="'Página ' + currentPage() + ' de ' + totalPages()"
  />

  @if (loading()) {
    <app-page-loading
      title="Cargando perfil del actor"
      description="Estamos explorando su trayectoria cinematográfica."
      detail="Consultando información y créditos en TMDB..."
      icon="fa-user"
    />
  }

  @if (errorMessage() && !loading()) {
    <div class="error-state">
      <span>⚠</span>
      <p>{{ errorMessage() }}</p>

      <button type="button" (click)="loadActors()">Intentar nuevamente</button>
    </div>
  }

  @if (!loading() && !errorMessage() && actors().length === 0) {
    <app-empty-state
      icon="fa-user"
      title="No encontramos personas"
      description="Prueba con otro nombre o departamento profesional."
    />
  }

  @if (!loading() && actors().length > 0) {
    <div class="row row-cols-2 row-cols-lg-3 row-cols-xl-5 g-4">
      @for (actor of actors(); track actor.id) {
        <div class="col">
          <app-actor-card [actor]="actor" [profileUrl]="getProfile(actor.profile_path)" />
        </div>
      }
    </div>

    @if (totalPages() > 1) {
      <app-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [loading]="loading()"
        (pageChange)="changePage($event)"
      />
    }
  }
</section>
