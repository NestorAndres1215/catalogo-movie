<section class="collections-page">
  <app-page-header
    section="UNIVERSOS CINEMATOGRÁFICOS"
    title="Colecciones y sagas"
    description="Descubre las grandes franquicias del cine y explora todas las películas que forman parte de ellas."
    [image]="bannerImage"
  />

  <div class="search-container">
    <app-search
      [value]="searchQuery()"
      placeholder="Buscar una saga..."
      (valueChange)="onSearchChange($event)"
    />
  </div>

  @if (loading()) {
    <app-page-loading
      title="Buscando colecciones"
      description="Explorando las grandes sagas cinematográficas."
      detail="Consultando colecciones en TMDB..."
      icon="fa-layer-group"
    />
  }

  @if (collections().length > 0) {
    <app-results-header
      title="Resultados de búsqueda"
      description="Colecciones y sagas que coinciden con tu búsqueda."
      [countLabel]="collections().length + ' colecciones'"
    />

    <div class="row row-cols-2 row-cols-lg-3 row-cols-xl-5 g-4">
      @for (collection of collections(); track collection.id) {
        <div class="col">
          <a class="collection-card" [routerLink]="['/collections', collection.id]">
            <div class="collection-poster">
              @if (collection.poster_path) {
                <img
                  [src]="getImageUrl(collection.poster_path)"
                  [alt]="collection.name"
                  loading="lazy"
                />
              } @else {
                <div class="no-poster">
                  <i class="fa-solid fa-film"></i>
                </div>
              }
            </div>

            <div class="collection-info">
              <h3>{{ collection.name }}</h3>
            </div>
          </a>
        </div>
      }
    </div>
  }
</section>
