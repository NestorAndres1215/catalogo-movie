<section class="decades-container">
  <app-page-header
    section="EXPLORA EL CINE"
    title="Películas por décadas"
    description="Descubre las películas más populares de cada época y revive la historia del cine."
  />

  <section class="decades-selector">
    <app-results-header title="Selecciona una década" />

    <div class="decades-list">
      @for (decade of decades; track decade.startYear) {
        <button
          type="button"
          class="decade-button"
          [class.active]="selectedDecade() === decade.startYear"
          (click)="selectDecade(decade.startYear)"
        >
          {{ decade.label }}
        </button>
      }
    </div>
  </section>

  <section class="movies-section">
    <app-results-header
      [title]="'Década de ' + selectedDecade() + '–' + (selectedDecade() + 9)"
      description="Películas ordenadas por popularidad."
      [countLabel]="movies().length + ' películas'"
    />
    @if (loading()) {
      <app-page-loading
        title="Cargando películas"
        description="Descubriendo películas para ti."
        detail="Consultando el catálogo cinematográfico de TMDB..."
        icon="fa-film"
      />
    }

    @if (!loading() && !errorMessage() && movies().length > 0) {
      <div class="row row-cols-2 row-cols-lg-3 row-cols-xl-5 g-4">
        @for (movie of movies(); track movie.id) {
          <div class="col">
            <app-media-card [media]="movie" mediaType="movie" variant="description" />
          </div>
        }
      </div>

      <app-pagination
        [currentPage]="page()"
        [totalPages]="totalPages()"
        (pageChange)="changePage($event)"
      />
    }

    @if (!loading() && !errorMessage() && movies().length === 0) {
      <div class="empty-state">No se encontraron películas para esta década.</div>
    }
  </section>
</section>
