<section class="directors-page">
  <app-page-header
    section="CINEVERSE / PROFESIONALES"
    title="Directores"
    description="Descubre a los cineastas detrás de tus películas favoritas."
    [image]="bannerImage"
  />

  <!-- BÚSQUEDA Y ORDEN -->
  <div class="director-toolbar">
    <app-search
      class="director-search"
      placeholder="Buscar director..."
      [value]="searchQuery()"
      (valueChange)="onSearch($event)"
    />

    <app-select-filter
      class="director-sort"
      id="sort"
      label="Ordenar por"
      placeholder="Seleccionar orden"
      [options]="sortOptions"
      [selectedValue]="filters().sortBy"
      (selectionChange)="onSortChange($event)"
    />
  </div>

  <!-- CARGANDO -->
  @if (loading()) {
    <app-page-loading
      title="Buscando directores"
      description="Descubriendo cineastas para ti."
      detail="Consultando el catálogo de TMDB..."
      icon="fa-clapperboard"
    />
  }

  <!-- ERROR -->
  @if (errorMessage()) {
    <div class="message message--error" role="alert">
      <p>{{ errorMessage() }}</p>
      <app-button
        variant="secondary"
        text="Reintentar"
        icon="fa-rotate-right"
        (clicked)="loadDirectors()"
      />
    </div>
  }

  <!-- SIN RESULTADOS -->
  @if (!loading() && !errorMessage() && directors().length === 0) {
    <app-empty-state
      icon="fa-clapperboard"
      title="No se encontraron directores"
      description="Intenta con otro nombre o revisa tu búsqueda."
    />
  }

  <!-- LISTADO -->
  @if (directors().length > 0) {
    <div class="directors-grid">
      @for (director of directors(); track director.id) {
        <app-actor-card [actor]="director" [profileUrl]="getProfile(director.profile_path)" />
      }
    </div>
    <!-- PAGINACIÓN -->
    <app-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [loading]="loading()"
      (pageChange)="changePage($event)"
    />
  }
</section>
