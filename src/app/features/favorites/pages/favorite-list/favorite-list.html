<section class="favorites-page">
  <app-page-header
    section="TU COLECCIÓN PERSONAL"
    title="Mis favoritos"
    description="Aquí encontrarás todas las películas y series que has guardado."
  />

  <app-stats [stats]="stats()" />

  <div class="favorites-toolbar">
    <app-filter-tabs
      [tabs]="favoriteTabs"
      [selected]="selectedType()"
      (selectionChange)="changeType($event)"
    />

    <span class="results-count"> {{ filteredFavorites().length }} resultados </span>
  </div>

  @if (filteredFavorites().length > 0) {
<div class="favorites-grid">
  @for (favorite of filteredFavorites(); track favorite.mediaType + '-' + favorite.id) {
<app-favorite-movie-card
  [movie]="toSavedMovie(favorite)"
  [imageUrl]="getImageUrl(favorite.posterPath)"
  (open)="openFavorite(favorite)"
  (remove)="removeFavorite(favorite)"
/>
  }
</div>
  } @else {
    @if (totalFavorites() === 0) {
      <app-empty-state
        icon="fa-heart"
        title="Aún no tienes favoritos"
        description="Explora las películas y series y presiona el corazón para guardar tus favoritas."
        actionText="Explorar películas"
        actionIcon="fa-film"
        actionRouterLink="/movies"
      />
    } @else {
      <app-empty-state
        icon="fa-filter"
        title="No hay resultados en esta categoría"
        description="Prueba seleccionando otra categoría."
        actionText="Explorar películas"
        actionIcon="fa-film"
        actionRouterLink="/movies"
      />
    }
  }
</section>
