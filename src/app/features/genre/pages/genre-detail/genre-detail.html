<section class="genre-detail-page">
  <!-- CARGANDO -->
  @if (loading()) {
    <app-page-loading
      title="Cargando contenido"
      description="Estamos preparando el contenido para ti."
      detail="Consultando información en TMDB..."
      icon="fa-film"
    />
  }

  <!-- ERROR -->
  @else if (errorMessage()) {
    <app-error-state
      title="Error"
      [description]="errorMessage()"
      linkText="Volver a géneros"
      linkRoute="/genres"
    />
  }

  <!-- CONTENIDO -->
  @else {
    <app-page-header
      section="CINEVERSE / GÉNEROS"
      [title]="genre()?.name ?? 'Género'"
      [description]="
        'Descubre ' + (selectedType() === 'movie' ? 'películas' : 'series') + ' de este género.'
      "
    />

    <app-results-header
      [title]="
        (selectedType() === 'movie' ? 'Películas' : 'Series') + ' de ' + (genre()?.name ?? '')
      "
      [description]="totalResults() + ' resultados encontrados'"
    />

    @if (media().length === 0) {
      <app-empty-state
        icon="fa-film"
        title="No hay contenido disponible"
        description="No se encontraron resultados para este género."
      />
    }

    @if (media().length > 0) {
      <div class="row row-cols-2 row-cols-lg-3 row-cols-xl-5 g-4">
        @for (item of media(); track item.id) {
          <div class="col">
            <app-media-card [media]="item" [mediaType]="selectedType()" variant="description" />
          </div>
        }
      </div>

      <app-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [loading]="loading()"
        (pageChange)="changePage($event)"
      />
    }
  }
</section>
