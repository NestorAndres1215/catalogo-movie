<section class="genres-page">
  <app-page-header
    section="CINEVERSE / EXPLORAR"
    title="Géneros"
    description="Explora películas y series según tus géneros favoritos."
    icon="fa-masks-theater"
  />

  <div class="row g-4 mb-4">
    <div class="col-12 col-md-6 col-lg-4">
      <app-filter-tabs
        [tabs]="mediaTabs"
        [selected]="selectedType()"
        (selectionChange)="changeType($event)"
      />
    </div>
  </div>

  <app-results-header
    [title]="selectedType() === 'movie' ? 'Géneros de películas' : 'Géneros de series'"
    description="Selecciona un género para descubrir contenido."
    [countLabel]="!loading() ? genres().length + ' géneros' : null"
  />

  @if (loading()) {
    <app-page-loading
      title="Cargando géneros"
      description="Explorando las categorías del universo cinematográfico."
      detail="Consultando géneros disponibles en TMDB..."
      icon="fa-layer-group"
    />
  }

  @if (errorMessage()) {
    <div class="message error">
      <p>{{ errorMessage() }}</p>

      <button type="button" (click)="loadGenres()">Reintentar</button>
    </div>
  }

  @if (!loading() && !errorMessage()) {
    <div class="row g-3">
      @for (genre of genres(); track genre.id) {
        <div class="col-12 col-md-6 col-lg-4">
          <a class="genre-card h-100" [routerLink]="['/genres', selectedType(), genre.id]">
            <div class="genre-icon">
              <i [class]="'fas ' + getGenreIcon(genre.name)"></i>
            </div>

            <div class="genre-info">
              <h3>{{ genre.name }}</h3>

              <span>
                Explorar contenido
                <i class="fas fa-arrow-right"></i>
              </span>
            </div>

            <div class="genre-arrow">
              <i class="fas fa-arrow-right"></i>
            </div>
          </a>
        </div>
      }
    </div>
  }
</section>
