<main class="languages-page">
  <app-page-header
    section="EXPLORA CINEVERSE"
    title="Películas por idioma"
    description="Descubre películas y series de diferentes partes del mundo según su idioma original."
  />

  <section class="filters-section d-flex flex-column flex-md-row align-items-md-end gap-3">
    <div class="col-12 col-md-4 col-lg-3">
      <app-select-filter
        id="language-select"
        label="Selecciona un idioma"
        placeholder="Todos los idiomas"
        [options]="languageOptions()"
        [selectedValue]="selectedLanguage()"
        (selectionChange)="changeLanguage($event)"
      />
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <app-filter-tabs
        class="d-block w-100"
        [tabs]="mediaTabs"
        [selected]="mediaType()"
        (selectionChange)="changeMediaType($event)"
      />
    </div>
  </section>

  <section class="results-header">
    <app-results-header
      [title]="getSelectedLanguageName()"
      [description]="(mediaType() === 'movie' ? 'Películas' : 'Series') + ' en idioma original'"
    />

    <span class="language-code">
      {{ selectedLanguage().toUpperCase() }}
    </span>
  </section>

  @if (loadingContent()) {
    <app-page-loading
      title="Buscando contenido"
      description="Explorando películas y series para ti."
      detail="Consultando el catálogo de TMDB..."
      icon="fa-magnifying-glass"
    />
  }

  @if (!loadingContent() && movies().length > 0) {
    <section class="row row-cols-2 row-cols-lg-3 row-cols-xl-5 g-4">
      @for (media of movies(); track media.id) {
        <div class="col">
          <app-media-card [media]="media" mediaType="movie" variant="description" />
        </div>
      }
    </section>

    <app-pagination
      [currentPage]="page()"
      [totalPages]="totalPages()"
      [loading]="loadingContent()"
      (pageChange)="changePage($event)"
    />
  }

  @if (!loadingContent() && !errorMessage() && movies().length === 0) {
    <app-empty-state
      icon="fa-language"
      title="No encontramos contenido"
      description="No hay resultados para este idioma. Prueba seleccionando otro idioma."
    />
  }
</main>
