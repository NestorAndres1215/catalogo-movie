<div class="filters-container">
  <div class="filter-group">
    <label for="genre">Género</label>

    <select id="genre" (change)="onGenreChange($event)">
      <option value="">Todos los géneros</option>

      @for (genre of genres; track genre.id) {
        <option [value]="genre.id">
          {{ genre.name }}
        </option>
      }
    </select>
  </div>

  <div class="filter-group">
    <label for="year">Año</label>

    <input
      id="year"
      type="number"
      min="1900"
      [max]="2100"
      placeholder="Ej. 2024"
      (change)="onYearChange($event)"
    />
  </div>

  <div class="filter-group">
    <label for="sort">Ordenar por</label>

    <select id="sort" (change)="onSortChange($event)">
      <option value="popularity.desc">Más populares</option>
      <option value="vote_average.desc">Mejor valoradas</option>
      <option value="primary_release_date.desc">Más recientes</option>
      <option value="primary_release_date.asc">Más antiguas</option>
    </select>
  </div>

  <button class="clear-button" (click)="clearFilters()">Limpiar filtros</button>
</div>
