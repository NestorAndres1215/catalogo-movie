<section class="movies-page">
  <app-page-header
    section="CINEVERSE / CATÁLOGO"
    title="Películas"
    description="Descubre historias, géneros y grandes producciones cinematográficas."
      [image]="bannerImage"
  />
  <div class="my-3">
    <app-search
      [value]="searchQuery()"
      placeholder="Buscar una película..."
      (valueChange)="onSearch($event)"
    />
  </div>
  <div class="my-3">
    <app-movie-filters [genres]="genres()" (filtersChange)="onFiltersChange($event)" />
  </div>
  <app-results-header
    [title]="title()"
    description="Explora y descubre contenido de nuestro catálogo."
    [countLabel]="'Página ' + currentPage() + ' de ' + totalPages()"
  />
  @if (loading()) {
    <app-page-loading
      title="Cargando peliculas"
      description="Estamos explorando peliculas."
      detail="Consultando información y créditos en TMDB..."
      icon="fa-user"
    />
  }

  @if (hasError()) {
    <div class="error-state">
      <span>⚠</span>
      <p>{{ errorMessage() }}</p>
      <button type="button" (click)="retry()">Intentar nuevamente</button>
    </div>
  }

  @if (isEmpty()) {
    <app-empty-state
      icon="fa-film"
      title="No encontramos películas"
      description="Prueba con otros filtros o términos de búsqueda."
    />
  }

  @if (hasMovies()) {
    <div class="movie-grid">
      @for (item of movies(); track item.id) {
        <app-media-card [media]="item" mediaType="movie"variant="description" />
      }
    </div>
    @if (totalPages() > 1) {
      <app-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [loading]="loading()"
        (pageChange)="changePage($event)"
      />
    }
  }
</section>
