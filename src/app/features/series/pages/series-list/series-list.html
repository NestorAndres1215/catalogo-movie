<section class="series-page">
  <app-page-header
    section="CINEVERSE / CATÁLOGO"
    title="Series"
    description="Descubre nuevas historias, temporadas y producciones televisivas."
  />

  <app-search
    [value]="searchQuery()"
    placeholder="Buscar una serie..."
    (valueChange)="onSearch($event)"
  />

  <app-series-filters [genres]="genres()" (filtersChange)="onFiltersChange($event)" />

  <app-results-header
    [title]="searchQuery() ? 'Resultados de búsqueda' : 'Catálogo de series'"
    [description]="
      searchQuery()
        ? 'Series que coinciden con tu búsqueda.'
        : 'Explora el catálogo de series disponibles.'
    "
    [countLabel]="'Página ' + currentPage() + ' de ' + totalPages()"
  />

  @if (loading()) {
    <app-page-loading
      title="Cargando series"
      description="Explorando las mejores series para ti."
      detail="Consultando el catálogo de series en TMDB..."
      icon="fa-tv"
    />
  }

  @if (!loading() && !errorMessage() && series().length === 0) {
    <app-empty-state
      icon="fa-tv"
      title="No encontramos series"
      description="Prueba con otros filtros o términos de búsqueda."
    />
  }

  @if (!loading() && series().length > 0) {
    <div class="series-grid">
      @for (item of series(); track item.id) {
        <app-media-card [media]="item" mediaType="tv" />
      }
    </div>

    @if (totalPages() > 1) {
      <app-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [loading]="loading()"
        (pageChange)="changePage($event)"
      />
    }
  }
</section>
