<section class="streaming-page">
  <app-page-header
    section="CINEVERSE ORIGINAL"
    title="Streaming y plataformas"
    description="Explora películas y series disponibles en tus plataformas favoritas."
    [image]="bannerImage"
  />

  <div class="row mb-4">
    <div class="col-12 col-md-4">
      <app-filter-tabs
        class="d-block w-100"
        [tabs]="mediaTabs"
        [selected]="mediaType()"
        (selectionChange)="changeMediaType($event)"
      />
    </div>
  </div>

  @if (loading()) {
    <app-page-loading
      title="Cargando plataformas"
      description="Buscando las plataformas disponibles en Perú."
      detail="Conectando con TMDB..."
      icon="fa-tv"
    />
  }

  @if (!loading() && errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }

  @if (!loading() && providers().length > 0) {
    <app-results-header
      title="Plataformas disponibles"
      description="Selecciona una plataforma para explorar su catálogo."
      [countLabel]="providers().length + ' plataformas'"
    />

   <div class="row row-cols-2 row-cols-lg-4 g-3">
      @for (provider of pagedProviders(); track provider.provider_id) {
        <div class="col">
          <a
            class="provider-card"
            [routerLink]="['/streaming', provider.provider_id]"
            [queryParams]="{ type: mediaType() }"
            [attr.aria-label]="'Ver catálogo de ' + provider.provider_name"
          >
            <div class="provider-logo">
              <img
                [src]="getProviderLogo(provider.logo_path)"
                [alt]="provider.provider_name"
                loading="lazy"
              />
            </div>

            <div class="provider-info">
              <span class="provider-name">{{ provider.provider_name }}</span>

            </div>
          </a>
        </div>
      }
    </div>

    <app-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [loading]="loading()"
      (pageChange)="changePage($event)"
    />
  }

  @if (!loading() && !errorMessage() && providers().length === 0) {
    <app-empty-state
      icon="fa-tv"
      title="No se encontraron plataformas"
      description="No hay plataformas disponibles para mostrar."
    />
  }
</section>
