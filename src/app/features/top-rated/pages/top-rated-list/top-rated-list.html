<section class="top-rated-page">
  <app-page-header
    section="CINEVERSE COLLECTION"
    title="Las más valoradas"
    description="Descubre las películas y series con las mejores puntuaciones de la comunidad."
    [image]="bannerImage()"
  />

  <div class="row mb-4">
    <div class="col-12 col-md-4">
      <app-filter-tabs
        class="d-block w-100"
        [tabs]="mediaTabs"
        [selected]="mediaType()"
        (selectionChange)="changeMediaType($event)"
      />
    </div>
  </div>
  <app-results-header
    [title]="mediaType() === 'movie' ? 'Películas más valoradas' : 'Series más valoradas'"
    description="Contenido con las mejores puntuaciones de la comunidad."
    [countLabel]="!loading() && !errorMessage() ? (totalResults() | number) + ' resultados' : null"
  />
  @if (loading()) {
    <app-page-loading
      title="Cargando las más valoradas"
      description="Descubriendo las películas mejor calificadas por los espectadores."
      detail="Consultando las valoraciones en TMDB..."
      icon="fa-star"
    />
  }

  @if (errorMessage()) {
    <div class="error-message">
      <p>{{ errorMessage() }}</p>

      <button type="button" (click)="loadTopRated()">Reintentar</button>
    </div>
  }

  @if (!loading() && !errorMessage()) {
    @if (items.length > 0) {
      <div class="media-grid">
        @for (item of items; track item.id; let i = $index) {
          <app-movie-card-ranking-details
            [media]="item"
            [position]="(currentPage() - 1) * 20 + i + 1"
            [mediaType]="mediaType()"
            [route]="mediaType() === 'movie' ? '/movies' : '/series'"
          />
        }
      </div>

      <app-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [loading]="loading()"
        (pageChange)="changePage($event)"
      />
    } @else {
      <app-empty-state
        icon="fa-magnifying-glass"
        title="No hay resultados"
        description="No se encontró contenido para mostrar."
      />
    }
  }
</section>
