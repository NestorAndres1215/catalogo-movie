<section class="ratings-page">
  <!-- ENCABEZADO -->
  <app-page-header
    section="MI BIBLIOTECA"
    title="Mis calificaciones"
    description="Todos los títulos que has calificado en CINEVERSE."
  />

  <!-- ESTADÍSTICAS -->
  <app-stats [stats]="stats()" />

  <!-- FILTROS -->
  <div
    class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 mb-4"
  >
    <app-results-header
      title="Mis puntuaciones"
      [description]="totalRated() + ' títulos registrados'"
    />

    <app-filter-tabs
      [tabs]="filterTabs"
      [selected]="selectedFilter()"
      (selectionChange)="selectFilter($event)"
    />
  </div>

  <!-- LISTADO -->
  @if (ratedItems().length > 0) {
    <div class="media-grid">
      @for (item of ratedItems(); track item.mediaType + '-' + item.id) {
        <app-media-details-card
          [item]="item"
          [showRatingComparison]="true"
          (detailsRequested)="openDetails($event.id, $event.mediaType)"
        />
      }
    </div>
  } @else {
    <!-- ESTADO VACÍO -->
    <app-empty-state
      icon="fa-star"
      [title]="
        selectedFilter() === 'all'
          ? 'Todavía no tienes calificaciones'
          : selectedFilter() === 'movie'
            ? 'No tienes películas calificadas'
            : 'No tienes series calificadas'
      "
      description="Asigna una puntuación personal a tus películas o series desde tu lista para ver y aparecerán aquí."
      actionText="Ir a mi lista para ver"
      actionIcon="fa-bookmark"
      (actionClicked)="goToWatchlist()"
    />
  }
</section>
