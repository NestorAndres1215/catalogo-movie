<section class="watched-page">
  <!-- ENCABEZADO -->
  <app-page-header
    section="MI BIBLIOTECA"
    title="Películas vistas"
    description="Aquí encontrarás todas las películas que ya has disfrutado."
    icon="fa-eye"
  />

  <app-stats [stats]="stats()" />

  <app-results-header
    title="Mi historial"
    description="Todas las películas que has visto y registrado en CINEVERSE."
    [totalResults]="totalWatched()"
  />

  @if (watchedMovies().length > 0) {
    <div class="media-grid">
      @for (item of watchedMovies(); track item.mediaType + '-' + item.id) {
        <app-media-card
          [media]="toMediaCard(item)"
          [mediaType]="item.mediaType"
          [isWatched]="true"
        />
      }
    </div>
  } @else {
    <!-- ESTADO VACÍO -->
    <app-empty-state
      icon="fa-film"
      title="Todavía no tienes películas vistas"
      description="Cuando cambies el estado de una película a 'Visto' en tu lista para ver, aparecerá automáticamente aquí."
      actionText="Ir a mi lista para ver"
      actionIcon="fa-bookmark"
      (actionClicked)="goToWatchlist()"
    />
  }
</section>
