<section class="watchlist-page">
  <!-- ENCABEZADO -->
  <app-page-header
    section="MI BIBLIOTECA"
    title="Mi lista para ver"
    description="Guarda las películas y series que quieres disfrutar después."
  />

  <!-- ESTADÍSTICAS -->

  <app-stats [stats]="stats()" />

  <!-- FILTROS -->
  <div
    class="ranking-toolbar d-flex flex-column flex-md-row align-items-stretch align-items-md-end justify-content-between gap-3 mt-4 mb-4"
  >
    <div class="col-12 col-md-6 col-lg-4">
      <app-filter-tabs
        [tabs]="watchlistTabs"
        [selected]="selectedFilter()"
        (selectionChange)="selectFilter($event)"
      />
    </div>
    @if (watchlist().length > 0) {
      <div class="ranking-action">
        <app-button
          text="Vaciar lista"
          icon="fa-trash"
          variant="secondary"
          (clicked)="clearWatchlist()"
        />
      </div>
    }
  </div>
  <app-results-header
    title="Mi lista de pelis y series"
    description="Todas tus películas y series guardadas en un solo lugar."
    [totalResults]="filteredItems().length"
  />
  <!-- LISTADO -->
  @if (filteredItems().length > 0) {
    <div class="media-grid">
      @for (item of filteredItems(); track item.mediaType + '-' + item.id) {
        <app-media-details-card [item]="item" [showRatingComparison]="false">
          <div class="personal-controls">
            <div class="control-group">
              <app-select-filter
                [id]="'status-' + item.mediaType + '-' + item.id"
                label="Estado de visualización"
                [options]="statusOptions"
                [selectedValue]="item.status ?? 'pending'"
                [openUp]="true"
                (selectionChange)="updateStatus(item.id, item.mediaType, $event)"
              />
            </div>

            <div class="control-group">
              <app-select-filter
                [id]="'rating-' + item.mediaType + '-' + item.id"
                label="Mi puntuación"
                placeholder="Sin calificar"
                [options]="ratingOptions"
                [selectedValue]="item.personalRating ?? ''"
                [openUp]="true"
                (selectionChange)="updatePersonalRating(item.id, item.mediaType, $event)"
              />
            </div>
          </div>
        </app-media-details-card>
      }
    </div>
  } @else {
    <!-- LISTA VACÍA -->
    @if (watchlist().length === 0) {
      <app-empty-state
        icon="fa-bookmark"
        title="Tu lista está vacía"
        description="Explora películas y series y agrega tus favoritas a tu lista para verlas más tarde."
        actionText="Explorar películas"
        actionIcon="fa-film"
        (actionClicked)="exploreMovies()"
      />
    } @else {
      <app-empty-state
        icon="fa-filter"
        title="No hay resultados"
        description="No tienes elementos guardados en esta categoría. Prueba seleccionando otra."
        actionText="Explorar películas"
        actionIcon="fa-film"
        (actionClicked)="exploreMovies()"
      />
    }
  }
</section>
