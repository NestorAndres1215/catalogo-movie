<a class="movie-card" [routerLink]="[route, media().id]">

  <div class="poster-container">

    @if (media().poster_path) {
      <img
        [src]="getPoster(media().poster_path)"
        [alt]="title"
        loading="lazy"
      />
    } @else {
      <div class="no-poster">
        <i [class]="mediaType() === 'movie' ? 'fas fa-film' : 'fas fa-tv'"></i>
        <p>Sin póster</p>
      </div>
    }

    @if (showRanking() && ranking() !== null) {
      <span class="ranking-badge" [class.top-three]="ranking()! <= 3">
        <i class="fas fa-trophy"></i>
        #{{ ranking() }}
      </span>
    }

    @if (isUpcoming()) {
      <span class="upcoming-badge">
        <i class="fas fa-calendar-days"></i>
        Próximamente
      </span>
    }

    <span class="rating">
      <i class="fas fa-star"></i>
      {{ media().vote_average.toFixed(1) }}
    </span>

  </div>

  <div class="media-info">
    <h3>{{ title }}</h3>

    <span class="media-date">
      {{ getLongDate(date) }}
    </span>
  </div>

</a>
