<a class="movie-card" [routerLink]="[route, media().id]">
  <div class="poster-container">
    @if (media().poster_path) {
      <img
        [src]="getPoster(media().poster_path)"
        [alt]="title"
        loading="lazy"
      />
    } @else {
      <div class="no-poster">
        <i [class]="mediaType() === 'movie' ? 'fas fa-film' : 'fas fa-tv'"></i>
        <p>Sin póster</p>
      </div>
    }

    @if (isWatched()) {
      <div class="badges">
        <span class="watched-badge">
          <i class="fas fa-check"></i>
          Visto
        </span>
      </div>
    } @else if (isUpcoming()) {
      <div class="badges">
        <span class="upcoming-badge">
          <i class="fas fa-clock"></i>
          Próximamente
        </span>
      </div>
    }

    <span class="rating">
      <i class="fas fa-star"></i>
      {{ media().vote_average.toFixed(1) }}
    </span>
  </div>

  <div class="media-info">
    <h3>{{ title }}</h3>

    <span class="media-date">
      {{ getLongDate(date) }}
    </span>
  </div>
</a>
