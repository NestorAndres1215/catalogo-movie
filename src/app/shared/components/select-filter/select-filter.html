<div class="filter-group d-flex flex-column gap-2">
  <label [attr.for]="id()" class="d-flex align-items-center gap-2">
    {{ label() }}
  </label>

  <div class="select-container position-relative w-100" [class.open]="isOpen()">
    <button
      type="button"
      class="select-trigger"
      [id]="id()"
      [class.is-placeholder]="!hasValue()"
      [disabled]="disabled()"
      aria-haspopup="listbox"
      [attr.aria-expanded]="isOpen()"
      (click)="toggle()"
      (keydown)="onKeydown($event)"
    >
      <span>{{ selectedLabel() }}</span>
      <i class="fas fa-chevron-down select-icon"></i>
    </button>

    @if (isOpen()) {
      <ul class="select-menu" [class.open-up]="openUp()" role="listbox">
        <li
          role="option"
          class="select-option"
          [class.selected]="!hasValue()"
          (click)="select('')"
        >
          <span>{{ placeholder() }}</span>
        </li>

        @for (option of options(); track option.value; let i = $index) {
          <li
            role="option"
            class="select-option"
            [class.selected]="isSelected(option)"
            [class.active]="i === activeIndex()"
            [attr.aria-selected]="isSelected(option)"
            (click)="select(option.value)"
            (mouseenter)="activeIndex.set(i)"
          >
            <span>{{ option.label }}</span>
            @if (isSelected(option)) {
              <i class="fas fa-check"></i>
            }
          </li>
        }
      </ul>
    }
  </div>
</div>
