<section class=" my-4 pt-3">
<app-results-header
  [title]="'Tráiler de ' + title()"
  [description]="description()"
/>

  <div class="trailer-frame p-2 p-md-3 rounded-4 border border-secondary-subtle shadow-lg">
    <div class="ratio ratio-16x9 rounded-3 overflow-hidden bg-black">
      <iframe
        [src]="trailerUrl()"
        [title]="'Tráiler de ' + title()"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        loading="lazy"
        allowfullscreen
      ></iframe>
    </div>
  </div>
</section>
